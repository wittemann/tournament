<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Info</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B5E34}a:hover{color:#0F3D21}
</style>
</helmet>
<div style="width: 390px; min-height: 1100px; box-sizing: border-box; background: #EEF2EC; font-family: 'Barlow', system-ui, sans-serif; color: #142019; display: flex; flex-direction: column">

  <header style="margin: 12px 12px 0; border-radius: 20px; background: {{green}}; color: #FFFFFF; padding: 10px 14px 10px 12px; display: flex; align-items: center; gap: 10px">
    <img src="/_blob/3e73ecb6740d16fd9a154cbb00cc66c8" alt="Bretten Kangaroos" style="height: 40px; width: auto">
    <div style="display: flex; flex-direction: column; gap: 0">
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: 0.5px; text-transform: uppercase">Xmas-Ball</div>
      <div style="font-size: 12px; font-weight: 600; opacity: 0.8">Bretten Kangaroos</div>
    </div>
    <div style="margin-left: auto; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; background: rgba(255,255,255,0.16); padding: 4px 12px; border-radius: 999px">14:18</div>
  </header>

  <nav aria-label="Hauptnavigation" style="padding: 10px 12px 0; display: flex; gap: 2px">
    <a href="Main.dc.html" style="flex: 1 1 auto; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 8px; border-radius: 999px; color: #3E4B42; font-size: 14px; font-weight: 600; text-decoration: none">Spielplan</a>
    <a href="Tabelle.dc.html" style="flex: 1 1 auto; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 8px; border-radius: 999px; color: #3E4B42; font-size: 14px; font-weight: 600; text-decoration: none">Tabelle</a>
    <a href="Finalrunde.dc.html" style="flex: 1 1 auto; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 8px; border-radius: 999px; color: #3E4B42; font-size: 14px; font-weight: 600; text-decoration: none">Finalrunde</a>
    <a href="Verkauf.dc.html" style="flex: 1 1 auto; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 8px; border-radius: 999px; color: #3E4B42; font-size: 14px; font-weight: 600; text-decoration: none">Verkauf</a>
    <a href="Info.dc.html" aria-current="page" style="flex: 1 1 auto; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 8px; border-radius: 999px; background: #142019; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none">Info</a>
  </nav>

  <section aria-label="Auf einen Blick" style="padding: 16px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #56645A">Ende</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">ca. 19:15</div>
      <div style="font-size: 14px; color: #56645A">Uhr</div>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #56645A">Turnierleitung</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">Halle 1</div>
      <div style="font-size: 14px; color: #56645A">Aufsichtsraum, Untergeschoss</div>
    </div>
    <a href="https://bretten-kangaroos.net/wp-content/uploads/2025/12/Regeln-X-Mas-Ball-2025.pdf" style="background: {{green}}; color: #FFFFFF; border-radius: 16px; padding: 14px; min-height: 56px; display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 16px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5"></path><path d="M9 13h7M9 17h5"></path></svg>
      Regeln <span style="font-weight: 500; opacity: 0.8">PDF</span>
    </a>
    <a href="https://bretten-kangaroos.net/wp-content/uploads/2025/12/Anfahrt_Parken.pdf" style="background: {{green}}; color: #FFFFFF; border-radius: 16px; padding: 14px; min-height: 56px; display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 16px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.5-6-11a6 6 0 0112 0c0 5.5-6 11-6 11z"></path><circle cx="12" cy="10" r="2.2"></circle></svg>
      Anfahrt <span style="font-weight: 500; opacity: 0.8">PDF</span>
    </a>
  </section>

  <section aria-labelledby="faq-h" style="padding: 22px 16px 28px; display: flex; flex-direction: column; gap: 10px">
    <h2 id="faq-h" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; text-transform: uppercase; color: #56645A">Häufige Fragen</h2>
    <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
      <sc-for list="{{faqs}}" as="faq" hint-placeholder-count="5">
        <div style="{{faq.rowStyle}}">
          <button type="button" aria-expanded="{{faq.expanded}}" onClick="{{faq.toggle}}" style="width: 100%; min-height: 56px; border: 0; background: transparent; padding: 14px 16px; display: flex; align-items: center; gap: 12px; text-align: left; font-family: inherit; font-size: 16px; font-weight: 600; color: #142019; cursor: pointer">
            <span style="flex: 1">{{faq.q}}</span>
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56645A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="{{faq.chevron}}"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <sc-if value="{{faq.open}}" hint-placeholder-val="{{false}}">
            <div style="padding: 0 16px 16px; font-size: 15px; line-height: 1.45; color: #3E4B42">
              {{faq.a}}
              <sc-if value="{{faq.href}}" hint-placeholder-val="{{false}}">
                <a href="{{faq.href}}" style="display: inline-flex; margin-top: 8px; font-weight: 700">{{faq.linkLabel}}</a>
              </sc-if>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"green":{"editor":"color","default":"#1B5E34","options":["#1B5E34","#15803D","#0F3D21"]},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { openId: 2 };
  }
  renderVals() {
    const data = [
      { id: 1, q: 'Wann ist die Veranstaltung zu Ende?', a: 'Ca. 19:15 Uhr.' },
      { id: 2, q: 'Gibt es Pokale und Medaillen?', a: 'Jeder Spieler bekommt eine Medaille, und für die ersten 4 Mannschaften gibt es auch einen Pokal.' },
      { id: 3, q: 'Wie sind die Regeln?', a: 'Alle Regeln findest du im PDF.', href: 'https://bretten-kangaroos.net/wp-content/uploads/2025/12/Regeln-X-Mas-Ball-2025.pdf', linkLabel: 'Regeln öffnen (PDF)' },
      { id: 5, q: 'Wo findet das Turnier statt?', a: 'In der Sporthalle „Im Grüner“ in Bretten.', href: 'https://bretten-kangaroos.net/wp-content/uploads/2025/12/Anfahrt_Parken.pdf', linkLabel: 'Anfahrt & Parken (PDF)' },
      { id: 6, q: 'Wo ist die Turnierleitung zu finden?', a: 'Im Aufsichtsraum von Halle 1 (Untergeschoss).' }
    ];
    const openId = this.state.openId;
    return {
      green: this.props.green ?? '#1B5E34',
      faqs: data.map((f, i) => {
        const open = f.id === openId;
        return {
          ...f,
          href: f.href || false,
          open,
          expanded: open ? 'true' : 'false',
          rowStyle: i === 0 ? '' : 'border-top: 1px solid #E6ECE5',
          chevron: open ? 'flex: none; transform: rotate(180deg)' : 'flex: none',
          toggle: () => this.setState({ openId: open ? null : f.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
